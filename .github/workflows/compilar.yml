name: Pipeline de Compilación y Empaquetado Automático

# Se dispara al PUBLICAR un Release en GitHub (no en push/merge a main).
# El AutoUpdater de la app lee releases/latest, así que el flujo natural es:
#   crear el Release con su tag (mayor que el anterior) -> publicar.
#
# `workflow_dispatch` añade el botón «Run workflow» de la pestaña Actions. Sirve
# para recompilar sin publicar un Release, y sobre todo para DIAGNOSTICAR: si el
# botón corre pero un Release no dispara nada, el problema está en el evento; si
# no corre ninguno de los dos, Actions está bloqueado a nivel de repositorio.
#
# El botón solo aparece cuando este archivo está en la rama POR DEFECTO.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Tag con el que sellar la compilación. Es obligatorio porque el CI
          escribe este valor en core/version.py: sin él, una ejecución manual
          publicaría un instalable que miente sobre su propia versión.
        required: true

# Permite que el GITHUB_TOKEN automático suba el instalador al Release.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      # Sincroniza la versión de la app con el TAG del Release, de forma que el
      # instalador SIEMPRE reporte exactamente su propio tag. Esto evita el bucle
      # de actualización: si version.py quedara por debajo del tag, la app se
      # actualizaría en cada arranque sin avanzar nunca.
      - name: Sincronizar versión con el tag del Release
        shell: pwsh
        run: |
          # En una ejecución manual no hay release, así que el tag lo pone la
          # entrada del formulario. El `||` de las expresiones de Actions toma
          # el primero que no esté vacío.
          $tag = "${{ github.event.release.tag_name || inputs.tag }}"
          $ver = $tag -replace '^v', ''
          Write-Host "Tag del release: $tag  ->  version: $ver"
          (Get-Content core/version.py) `
            -replace '^\s*__version__\s*=.*', "__version__ = `"$ver`"" `
            | Set-Content core/version.py -Encoding utf8
          (Get-Content instalador.iss) `
            -replace '^AppVersion=.*', "AppVersion=$ver" `
            | Set-Content instalador.iss -Encoding utf8
          Write-Host "--- version.py ---"; Get-Content core/version.py | Select-String '__version__'
          Write-Host "--- instalador.iss ---"; Get-Content instalador.iss | Select-String '^AppVersion='

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install flet pyinstaller
          if (Test-Path requirements.txt) { pip install -r requirements.txt }

      # Smoke test de imports: importa app + todos los modulos de core/ y ui/ para
      # detectar imports rotos o modulos faltantes ANTES de compilar y publicar.
      # Si algo no importa, el build FALLA aqui y el Release roto no llega a nadie.
      - name: Smoke test de imports (falla si algo no importa)
        shell: pwsh
        run: python scripts/smoke_import.py

      # 1. Compilar la app con flet pack (onedir). Incluye el driver de Playwright
      #    via --collect-all. NO empaqueta Chromium: se descarga en la 1ra
      #    ejecución del RPA en la PC del usuario. Imagenes sí va (versionada).
      - name: Compilar con flet pack
        shell: pwsh
        run: |
          $datos = @("--add-data", "Imagenes:Imagenes")
          # La tipografía Inter es OPCIONAL y se detecta en vez de fijarse: si el
          # .ttf está versionado se empaqueta, y si no, la app cae a la fuente del
          # sistema (ui/tema.py -> registrar_fuente). Con --add-data fijo, un repo
          # sin la carpeta tumbaría el build; así, agregarla no exige tocar el CI.
          if (Test-Path "Fuentes") { $datos += @("--add-data", "Fuentes:Fuentes") }
          flet pack app.py -n "ActivosFijos" -D $datos `
            --hidden-import openpyxl `
            --pyinstaller-build-args=--collect-all=playwright `
            -y

      # 2. Instalar Inno Setup y compilar el instalador (instalador.iss).
      - name: Instalar Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Compilar Instalador con Inno Setup
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" instalador.iss'

      # 4. Publicar el instalador como asset del Release (nombre exacto que busca
      #    el AutoUpdater: Instalador_ActivosFijos.exe).
      #
      #    UN solo paso para los dos disparos. El tag sale del release cuando lo
      #    hay, y de la entrada del formulario cuando se lanzó a mano: así el
      #    botón adjunta al release YA PUBLICADO en vez de dejar el ejecutable
      #    como artefacto suelto, que obligaba a bajarlo y subirlo a mano.
      - name: Subir Instalador al Release de GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag }}
          files: Output/Instalador_ActivosFijos.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
